name: Publish RunPod Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v3)"
        required: true
        type: string
      extras:
        description: "Comma-separated uv extras to install"
        required: true
        default: "cu129,diarization-sortformer,translation"
        type: string
      also_latest:
        description: "Also tag the image as latest"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tiltiano15/wlk-runpod

jobs:
  docker:
    name: Build and push ${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.inputs.tag }}
      EXTRAS: ${{ github.event.inputs.extras }}
      ALSO_LATEST: ${{ github.event.inputs.also_latest }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          if [[ ! "$EXTRAS" =~ ^[a-z0-9,-]+$ ]]; then
            echo "Invalid extras list" >&2
            exit 1
          fi

      # The CUDA image is ~23 GB uncompressed; the default runner only has
      # ~14 GB free, so drop preinstalled toolchains we don't need.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Compute tags
        id: tags
        run: |
          {
            echo "value<<EOF"
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            if [[ "$ALSO_LATEST" == "true" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            EXTRAS=${{ env.EXTRAS }}
          tags: ${{ steps.tags.outputs.value }}
